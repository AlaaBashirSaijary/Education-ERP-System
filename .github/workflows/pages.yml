name: Publish demo to GitHub Pages

# Publishes docs/demo (a static, clickable demo of the real pages) at
# https://<owner>.github.io/<repo>/ . Enable once: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [claude/zen-cray-qms4d9]
    paths: ['docs/demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/demo
      - id: deployment
        uses: actions/deploy-pages@v4
